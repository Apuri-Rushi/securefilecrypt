<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#0f172a; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="encCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="decCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="failCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>

    <!-- Filters for soft drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="780" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="1160" height="740" rx="16" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#0284c7" />
    <path d="M12 20 L19 13 L26 20 M19 13 L19 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <text x="50" y="22" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.5">Baseline Cryptosystem Architecture</text>
    <text x="50" y="38" font-size="13" font-weight="400" fill="#94a3b8">Reconstruction of Rosandi et al. (2026) — Monolithic AES-256-GCM with PBKDF2-HMAC-SHA256</text>
    
    <!-- Legend / Badges -->
    <rect x="850" y="6" width="120" height="26" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
    <text x="910" y="23" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">ENCRYPTION PATH</text>
    <rect x="980" y="6" width="120" height="26" rx="6" fill="#0f766e" fill-opacity="0.3" stroke="#0d9488" stroke-width="1"/>
    <text x="1040" y="23" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle">DECRYPTION PATH</text>
  </g>

  <!-- ==================== TOP LANE: ENCRYPTION WORKFLOW ==================== -->
  <g transform="translate(50, 110)">
    <!-- Lane container -->
    <rect x="0" y="0" width="1100" height="270" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="25" y="30" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="0.5">ENCRYPTION PIPELINE (WHOLE-FILE IN-MEMORY BUFFER)</text>

    <!-- Node 1: User Input -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="170" height="180" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="170" height="34" rx="10" fill="#0369a1"/>
      <rect x="0" y="24" width="170" height="10" fill="#0369a1"/>
      <text x="85" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1. INPUT DATA</text>
      
      <circle cx="28" cy="65" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="28" y="69" font-size="12" fill="#38bdf8" text-anchor="middle">📄</text>
      <text x="50" y="65" font-size="12" font-weight="600" fill="#f1f5f9">Plaintext File</text>
      <text x="50" y="80" font-size="10" fill="#94a3b8">Loaded fully into RAM</text>

      <circle cx="28" cy="120" r="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="28" y="124" font-size="12" fill="#38bdf8" text-anchor="middle">🔑</text>
      <text x="50" y="120" font-size="12" font-weight="600" fill="#f1f5f9">User Passphrase</text>
      <text x="50" y="135" font-size="10" fill="#94a3b8">UTF-8 String</text>

      <rect x="15" y="152" width="140" height="18" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.7"/>
      <text x="85" y="165" font-size="9.5" font-weight="600" fill="#f87171" text-anchor="middle">Linear Memory O(N)</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 195 145 L 245 145" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Node 2: Key & Nonce Derivation -->
    <g transform="translate(250, 55)">
      <rect x="0" y="0" width="220" height="180" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="220" height="34" rx="10" fill="#0369a1"/>
      <rect x="0" y="24" width="220" height="10" fill="#0369a1"/>
      <text x="110" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. KEY DERIVATION (PBKDF2)</text>

      <rect x="15" y="48" width="190" height="38" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="64" font-size="11" font-weight="600" fill="#f8fafc">Random Salt &amp; Nonce</text>
      <text x="25" y="78" font-size="9.5" fill="#38bdf8">os.urandom(16) | os.urandom(12)</text>

      <rect x="15" y="94" width="190" height="48" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="110" font-size="11" font-weight="600" fill="#f8fafc">PBKDF2-HMAC-SHA256</text>
      <text x="25" y="124" font-size="9.5" fill="#94a3b8">100,000 iterations (NIST SP 800-132)</text>
      <text x="25" y="136" font-size="9.5" fill="#38bdf8">Derived Key: 256 bits (32B)</text>

      <rect x="15" y="152" width="190" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.7"/>
      <text x="110" y="165" font-size="9.5" font-weight="600" fill="#fbbf24" text-anchor="middle">Compute-only: 0 MB RAM (No GPU defense)</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 470 145 L 520 145" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Node 3: AES-GCM Encrypt -->
    <g transform="translate(525, 55)">
      <rect x="0" y="0" width="230" height="180" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="230" height="34" rx="10" fill="#0369a1"/>
      <rect x="0" y="24" width="230" height="10" fill="#0369a1"/>
      <text x="115" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. MONOLITHIC AES-256-GCM</text>

      <rect x="15" y="48" width="200" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="65" font-size="11" font-weight="600" fill="#f8fafc">Single OpenSSL Call</text>
      <text x="25" y="80" font-size="9.5" fill="#38bdf8">aesgcm.encrypt(nonce, data, None)</text>

      <rect x="15" y="98" width="200" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="115" font-size="11" font-weight="600" fill="#f8fafc">Output Components</text>
      <text x="25" y="130" font-size="9.5" fill="#94a3b8">Ciphertext (N bytes) + Tag (16 bytes)</text>

      <rect x="15" y="152" width="200" height="18" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="0.7"/>
      <text x="115" y="165" font-size="9.5" font-weight="600" fill="#f87171" text-anchor="middle">Holds 2N + 44B RAM simultaneously</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M 755 145 L 805 145" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)"/>

    <!-- Node 4: Container Assembly & Download -->
    <g transform="translate(810, 55)">
      <rect x="0" y="0" width="265" height="180" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="265" height="34" rx="10" fill="#0369a1"/>
      <rect x="0" y="24" width="265" height="10" fill="#0369a1"/>
      <text x="132" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. SERIALIZED CONTAINER</text>

      <text x="15" y="58" font-size="10.5" font-weight="600" fill="#94a3b8">Binary File Format Layout:</text>
      
      <!-- Container blocks -->
      <g transform="translate(15, 68)">
        <rect x="0" y="0" width="48" height="28" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8"/>
        <text x="24" y="14" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Salt</text>
        <text x="24" y="24" font-size="7.5" fill="#38bdf8" text-anchor="middle">16B</text>

        <rect x="52" y="0" width="48" height="28" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8"/>
        <text x="76" y="14" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Nonce</text>
        <text x="76" y="24" font-size="7.5" fill="#38bdf8" text-anchor="middle">12B</text>

        <rect x="104" y="0" width="76" height="28" rx="4" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8"/>
        <text x="142" y="14" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Ciphertext</text>
        <text x="142" y="24" font-size="7.5" fill="#38bdf8" text-anchor="middle">N bytes</text>

        <rect x="184" y="0" width="48" height="28" rx="4" fill="#0f766e" fill-opacity="0.4" stroke="#2dd4bf"/>
        <text x="208" y="14" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Tag</text>
        <text x="208" y="24" font-size="7.5" fill="#2dd4bf" text-anchor="middle">16B</text>
      </g>

      <text x="15" y="118" font-size="10" fill="#cbd5e1">• No Magic Bytes (Fails crypto, not syntax)</text>
      <text x="15" y="132" font-size="10" fill="#cbd5e1">• No Encrypted Metadata (Name exposed/lost)</text>
      <text x="15" y="146" font-size="10" fill="#cbd5e1">• Direct Key: Password change = re-encrypt</text>

      <rect x="15" y="152" width="235" height="18" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="0.7"/>
      <text x="132" y="165" font-size="9.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Saved / Downloaded as Encrypted File</text>
    </g>
  </g>

  <!-- ==================== CONNECTOR BETWEEN ENCRYPTION & DECRYPTION ==================== -->
  <g transform="translate(1000, 380)">
    <path d="M 50 0 L 50 35 L -100 35 L -100 70" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowTeal)"/>
    <text x="-25" y="26" font-size="10" font-weight="600" fill="#2dd4bf" text-anchor="middle">Feed Container to Decryptor</text>
  </g>

  <!-- ==================== BOTTOM LANE: DECRYPTION WORKFLOW ==================== -->
  <g transform="translate(50, 450)">
    <!-- Lane container -->
    <rect x="0" y="0" width="1100" height="280" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="25" y="30" font-size="14" font-weight="700" fill="#2dd4bf" letter-spacing="0.5">DECRYPTION &amp; AUTHENTICATION VERIFICATION PATH</text>

    <!-- Node D1: Container Input -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="180" height="195" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="180" height="34" rx="10" fill="#0f766e"/>
      <rect x="0" y="24" width="180" height="10" fill="#0f766e"/>
      <text x="90" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">D1. UNPACK CONTAINER</text>

      <circle cx="28" cy="65" r="12" fill="#1e293b" stroke="#2dd4bf" stroke-width="1"/>
      <text x="28" y="69" font-size="12" fill="#2dd4bf" text-anchor="middle">📦</text>
      <text x="50" y="65" font-size="11" font-weight="600" fill="#f1f5f9">Encrypted File</text>
      <text x="50" y="78" font-size="9.5" fill="#94a3b8">Unpack Salt, Nonce, CT, Tag</text>

      <circle cx="28" cy="115" r="12" fill="#1e293b" stroke="#2dd4bf" stroke-width="1"/>
      <text x="28" y="119" font-size="12" fill="#2dd4bf" text-anchor="middle">🔑</text>
      <text x="50" y="115" font-size="11" font-weight="600" fill="#f1f5f9">Candidate Password</text>
      <text x="50" y="128" font-size="9.5" fill="#94a3b8">Supplied by user</text>

      <rect x="15" y="155" width="150" height="26" rx="4" fill="#0f766e" fill-opacity="0.2" stroke="#0d9488" stroke-width="0.7"/>
      <text x="90" y="172" font-size="9.5" font-weight="600" fill="#2dd4bf" text-anchor="middle">Parses Header Offsets</text>
    </g>

    <!-- Arrow D1 to D2 -->
    <path d="M 205 152 L 255 152" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>

    <!-- Node D2: PBKDF2 Candidate Key -->
    <g transform="translate(260, 55)">
      <rect x="0" y="0" width="220" height="195" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="220" height="34" rx="10" fill="#0f766e"/>
      <rect x="0" y="24" width="220" height="10" fill="#0f766e"/>
      <text x="110" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">D2. DERIVE CANDIDATE KEY</text>

      <rect x="15" y="48" width="190" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="66" font-size="11" font-weight="600" fill="#f8fafc">PBKDF2-HMAC-SHA256</text>
      <text x="25" y="80" font-size="9.5" fill="#2dd4bf">Salt from file + user password</text>

      <rect x="15" y="102" width="190" height="42" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="118" font-size="11" font-weight="600" fill="#f8fafc">100,000 Iterations</text>
      <text x="25" y="132" font-size="9.5" fill="#94a3b8">Produces 32-byte Candidate Key</text>

      <rect x="15" y="155" width="190" height="26" rx="4" fill="#0f766e" fill-opacity="0.2" stroke="#0d9488" stroke-width="0.7"/>
      <text x="110" y="172" font-size="9.5" font-weight="600" fill="#2dd4bf" text-anchor="middle">Identical Derivation Cost (18.7ms)</text>
    </g>

    <!-- Arrow D2 to D3 -->
    <path d="M 480 152 L 530 152" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>

    <!-- Node D3: AES-GCM Decrypt & Authenticate -->
    <g transform="translate(535, 55)">
      <rect x="0" y="0" width="240" height="195" rx="10" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="240" height="34" rx="10" fill="#0f766e"/>
      <rect x="0" y="24" width="240" height="10" fill="#0f766e"/>
      <text x="120" y="22" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">D3. GCM TAG VERIFICATION</text>

      <rect x="15" y="48" width="210" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="66" font-size="11" font-weight="600" fill="#f8fafc">Monolithic aesgcm.decrypt()</text>
      <text x="25" y="80" font-size="9.5" fill="#2dd4bf">Evaluates GHASH over CT + Tag</text>

      <rect x="15" y="102" width="210" height="44" rx="6" fill="#1e293b" stroke="#334155"/>
      <text x="25" y="118" font-size="11" font-weight="600" fill="#f8fafc">Integrity &amp; Key Check</text>
      <text x="25" y="132" font-size="9.5" fill="#94a3b8">Validates tag against candidate key</text>

      <!-- Fork Indicator -->
      <path d="M 225 120 L 240 100" fill="none" stroke="#2dd4bf" stroke-width="1.5"/>
      <path d="M 225 120 L 240 140" fill="none" stroke="#f87171" stroke-width="1.5"/>
    </g>

    <!-- Branch A: Success (Arrow Up-Right) -->
    <path d="M 775 120 L 825 95" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrowTeal)"/>

    <!-- Branch B: Failure (Arrow Down-Right) -->
    <path d="M 775 160 L 825 185" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed)"/>

    <!-- Node D4a: Success Outcome -->
    <g transform="translate(830, 48)">
      <rect x="0" y="0" width="245" height="92" rx="8" fill="#0f172a" stroke="#0d9488" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="245" height="24" rx="8" fill="#0f766e"/>
      <rect x="0" y="16" width="245" height="8" fill="#0f766e"/>
      <text x="122" y="17" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AUTHENTICATION PASS (TAG VALID)</text>
      
      <circle cx="25" cy="55" r="10" fill="#0f766e" fill-opacity="0.4"/>
      <text x="25" y="59" font-size="11" fill="#2dd4bf" text-anchor="middle">✓</text>
      <text x="45" y="52" font-size="10.5" font-weight="600" fill="#f1f5f9">Plaintext Released into RAM</text>
      <text x="45" y="68" font-size="9" fill="#94a3b8">File decrypted &amp; saved to destination</text>
      <text x="45" y="80" font-size="8.5" fill="#2dd4bf">SHA-256 matches original bitstream</text>
    </g>

    <!-- Node D4b: Authentication Failure Outcome -->
    <g transform="translate(830, 150)">
      <rect x="0" y="0" width="245" height="92" rx="8" fill="#0f172a" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
      <rect x="0" y="0" width="245" height="24" rx="8" fill="#991b1b"/>
      <rect x="0" y="16" width="245" height="8" fill="#991b1b"/>
      <text x="122" y="17" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AUTHENTICATION FAILED (TAG MISMATCH)</text>
      
      <circle cx="25" cy="55" r="10" fill="#991b1b" fill-opacity="0.4"/>
      <text x="25" y="59" font-size="11" fill="#f87171" text-anchor="middle">✗</text>
      <text x="45" y="50" font-size="10.5" font-weight="600" fill="#fca5a5">Raises AuthenticationError</text>
      <text x="45" y="66" font-size="9" fill="#94a3b8">Wrong password OR tampered ciphertext</text>
      <text x="45" y="80" font-size="8.5" font-weight="700" fill="#f87171">Zero Plaintext Released (Atomic abort)</text>
    </g>
  </g>
</svg>
